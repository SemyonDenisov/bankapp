{{- if .Values.indexTemplate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: create-index-template
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-index-template
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              until curl -s http://{{ .Release.Name }}:9200; do
                echo "Waiting for Elasticsearch..."
                sleep 5
              done

              echo "Creating ILM policy..."
              curl -X PUT "http://{{ .Release.Name }}:9200/_ilm/policy/{{ .Values.indexTemplate.lifecycle }}" \
                   -H 'Content-Type: application/json' \
                   -d '{
                    "policy": {
                      "phases": {
                        "hot": {
                          "min_age": "0ms",
                          "actions": {
                            "rollover": {
                              "max_size": "1GB",
                              "max_age": "1d"
                            }
                          }
                        },
                        "delete": {
                          "min_age": "3d",
                          "actions": {
                            "delete": {}
                          }
                        }
                      }
                    }
                  }'

              echo "Creating index template..."
              curl -X PUT "http://{{ .Release.Name }}:9200/_index_template/{{ .Values.indexTemplate.name }}" \
                   -H 'Content-Type: application/json' \
                   -d '{
                    "index_patterns": ["{{ .Values.indexTemplate.pattern }}"],
                    "settings": {
                      "number_of_shards": {{ .Values.indexTemplate.shards }},
                      "number_of_replicas": {{ .Values.indexTemplate.replicas }},
                      "index.lifecycle.name": "{{ .Values.indexTemplate.lifecycle }}"
                    },
                    "mappings": {
                      "properties": {
                        "time": { "type": "date", "format": "HH:mm:ss" },
                        "log_level": { "type": "keyword" },
                        "service": { "type": "keyword" },
                        "trace": { "type": "keyword" },
                        "log_message": { "type": "text" }
                      }
                    }
                  }'
{{- end }}
